<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接你的学习助手</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#102a33;background:#f8faf8}*{box-sizing:border-box}body{margin:0;padding:30px 20px}main{max-width:460px;margin:auto}header{margin:10px 0 32px}h1{font-size:29px;letter-spacing:-1px;margin-bottom:10px}p,small{color:#597078;line-height:1.7}.steps{display:flex;justify-content:space-between;padding:18px 0;color:#009c92;font-size:15px}label{display:block;font-weight:650;margin:23px 0 9px}input,select{font:inherit;width:100%;min-height:54px;border:1px solid #cbdad6;border-radius:12px;padding:13px;background:white;color:inherit}input:focus,select:focus{outline:2px solid #009c92;outline-offset:2px}.secret{position:relative}.secret input{padding-right:68px}.eye{position:absolute;right:5px;top:5px;width:58px;height:44px;border:0;background:transparent;color:#007b73;cursor:pointer}button.primary{border:0;background:#009c92;color:white;border-radius:13px;width:100%;padding:17px;font:inherit;font-size:19px;font-weight:650;margin-top:28px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{padding:16px;border-radius:12px;background:#e8f5f2;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;margin:18px 0}footer{text-align:center;margin:24px 0;font-size:14px;color:#597078}.note{font-size:14px}
</style><main><header><small>学习助手 · 家长设置</small><h1>连接你的学习助手</h1><p>首次设置完成后，孩子日常使用无需手机。</p><div class="steps"><b>1 联网</b><span>2 模型</span><span>3 完成</span></div></header>
<form id="form"><label for="networks">附近的 Wi-Fi</label><select id="networks"><option value="">点击扫描后选择网络</option></select><button id="scan" class="secondary" type="button">扫描附近 Wi-Fi</button><p id="scan-status" class="note" role="status">支持 2.4 GHz Wi-Fi，也可以手动输入。</p><label for="ssid">家庭 Wi-Fi 名称</label><input id="ssid" name="ssid" autocomplete="off" required placeholder="从上方选择，或手动输入"><label for="password">Wi-Fi 密码</label><div class="secret"><input id="password" name="password" type="password" autocomplete="new-password" maxlength="63" placeholder="开放网络可留空"><button type="button" class="eye" data-for="password" aria-label="显示 Wi-Fi 密码">显示</button></div>
<label for="provider">大模型服务商</label><input id="provider" value="通义千问 Qwen · 阿里云百炼" disabled><label for="region">API Key 所属地域</label><select id="region"><option value="0">中国内地（北京）</option><option value="1">国际（新加坡）</option></select>
<label for="key">API Key / Token</label><div class="secret"><input id="key" name="key" type="password" autocomplete="new-password" maxlength="256" required spellcheck="false" placeholder="sk-…"><button type="button" class="eye" data-for="key" aria-label="显示 API Key">显示</button></div><p class="note">密钥保存后隐藏，可随时重新配置。请填写所选地域对应的百炼密钥。</p>
<button id="test" class="secondary" type="button">测试 Wi-Fi 和 Token</button><button id="save" class="primary" type="submit">保存配置</button><p class="note">测试会实际连接 Wi-Fi 并调用模型，不保存配置。保存时会再次测试，通过后重启设备。</p></form><div id="status" role="status" aria-live="polite">请保持手机连接设备热点。提示“无法上网”时选择继续连接。</div><footer>设置页地址：192.168.4.1</footer></main>
<style>.secondary{border:1px solid #009c92;background:#e8f5f2;color:#007b73;border-radius:12px;width:100%;padding:14px;font:inherit;margin-top:14px;cursor:pointer}button.primary{margin-top:14px}</style>
<script>
'use strict';
const $=id=>document.getElementById(id);let nonce='',pending=false;
function busy(value){pending=value;for(const id of ['save','test','scan','networks','ssid','password','key','region'])$(id).disabled=value;}
$('networks').onchange=()=>{if($('networks').value)$('ssid').value=$('networks').value;};
$('scan').onclick=async()=>{if(pending)return;$('scan').disabled=true;$('scan-status').textContent='正在扫描…';try{const r=await fetch('/api/wifi',{cache:'no-store'}),s=await r.json();if(!r.ok)throw Error(s.error||'扫描失败');$('networks').replaceChildren(new Option('请选择网络',''));for(const network of s.networks){$('networks').add(new Option(network.ssid+' · '+(network.secure?'加密':'免密')+' · '+network.rssi+' dBm',network.ssid));}$('scan-status').textContent=s.networks.length?'已找到 '+s.networks.length+' 个网络，请在上方选择':'未找到网络，可重新扫描或手动输入';}catch(e){$('scan-status').textContent=e.message||'扫描失败，可手动输入';}finally{$('scan').disabled=pending;}};
document.querySelectorAll('.eye').forEach(button=>button.onclick=()=>{const input=$(button.dataset.for),show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'隐藏':'显示';button.setAttribute('aria-label',(show?'隐藏':'显示')+(input.id==='key'?' API Key':' Wi-Fi 密码'));});
async function session(){const r=await fetch('/api/session',{cache:'no-store'});if(!r.ok)throw Error('无法读取配置会话，请刷新页面');nonce=(await r.json()).nonce;}
async function poll(){if(!pending)return;try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();$('status').textContent=s.message;if(!s.busy){busy(false);return;}}catch(e){$('status').textContent='设备可能正在重启或切换 Wi-Fi。若尚未完成，请重新连接设备热点并刷新本页，或查看设备屏幕。';}if(pending)setTimeout(poll,1500);}
async function submit(save){if(pending)return;if(!$('form').reportValidity())return;const ssid=$('ssid').value,password=$('password').value,key=$('key').value.trim().replace(/^Bearer\s+/i,'').replace(/[\s\u200B-\u200D\uFEFF]/g,'');if(!ssid||new TextEncoder().encode(ssid).length>32){$('status').textContent='Wi-Fi 名称应为 1–32 个字节，请检查输入';return;}if(password&&(new TextEncoder().encode(password).length<8||new TextEncoder().encode(password).length>63)){$('status').textContent='Wi-Fi 密码应为 8–63 个字节';return;}if(!key.startsWith('sk-')){$('status').textContent='API Key 应以 sk- 开头，请检查是否复制了完整密钥';return;}if(key.length<8||key.length>256||/[^\x21-\x7e]/.test(key)){$('status').textContent='密钥长度或字符异常，请重新粘贴完整 API Key；有效性由实际连接测试判断';return;}const region=Number($('region').value);busy(true);$('status').textContent='正在提交'+(save?'配置':'测试')+'…';try{if(!nonce)await session();const r=await fetch(save?'/api/config':'/api/test',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Nonce':nonce},body:JSON.stringify({ssid,password,key,region})});const s=await r.json();if(!r.ok)throw Error(s.error||'提交失败，请重试');if(save){$('key').value='';$('password').value='';}$('status').textContent='正在测试 Wi-Fi 和 Token。切换 Wi-Fi 时手机可能需要重新连接设备热点。';setTimeout(poll,1000);}catch(e){busy(false);$('status').textContent=e.message||'无法连接设备，请检查热点';}}
$('form').onsubmit=event=>{event.preventDefault();submit(true);};$('test').onclick=()=>submit(false);
session().catch(e=>$('status').textContent=e.message);
</script></html>
